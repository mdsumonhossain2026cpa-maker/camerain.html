<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ক্যামেরা ফোন (Sender)</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; padding: 20px; }
        video { width: 100%; max-width: 400px; border-radius: 10px; border: 3px solid #00ff00; background: #000; }
        .status { font-size: 16px; color: #00ff00; margin: 15px 0; background: #111; padding: 10px; border-radius: 5px;}
    </style>
</head>
<body>
    <h2>🎥 ক্যামেরা সোর্স (Sender)</h2>
    <div class="status" id="status">সার্ভারে কানেক্ট হচ্ছে...</div>
    <video id="localVideo" autoplay playsinline muted></video>

    <script>
        let localStream;
        const CAMERA_ID = 'akash-cam-12345'; // নির্দিষ্ট আইডি
        const peer = new Peer(CAMERA_ID);

        peer.on('open', (id) => {
            document.getElementById('status').innerText = "ক্যামেরা রেডি! ভিউয়ারের অপেক্ষায়...";
            startCamera();
        });

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
            .then((stream) => {
                localStream = stream;
                document.getElementById('localVideo').srcObject = stream;
            })
            .catch(err => {
                document.getElementById('status').innerHTML = `<span style="color:red">ক্যামেরা এরর: ${err.message}</span>`;
            });
        }

        // ভিউয়ার যখন ডাটা কানেক্ট করবে
        peer.on('connection', (conn) => {
            document.getElementById('status').innerText = "ভিউয়ার কানেক্ট হয়েছে! ভিডিও পাঠানো হচ্ছে...";
            
            // ক্যামেরা ফোন নিজে থেকে ভিউয়ারকে ভিডিও কল ব্যাক করবে (এটি সমস্যার সমাধান করবে)
            peer.call(conn.peer, localStream);

            conn.on('data', (data) => {
                if (data === 'toggle-flash') toggleFlashlight();
            });
        });

        function toggleFlashlight() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            const hasTorch = track.getCapabilities().torch;
            if (hasTorch) {
                const isTorchOn = track.getConstraints().advanced?.[0]?.torch;
                track.applyConstraints({ advanced: [{ torch: !isTorchOn }] });
            }
        }
    </script>
</body>
</html>
