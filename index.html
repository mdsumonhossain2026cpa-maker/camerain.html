<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ক্যামেরা ফোন (Sender)</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; padding: 20px; }
        video { width: 100%; max-width: 400px; border-radius: 10px; border: 3px solid #00ff00; background: #000; }
        .status { font-size: 16px; color: #00ff00; margin: 15px 0; background: #111; padding: 10px; border-radius: 5px;}
    </style>
</head>
<body>

    <h2>🎥 ক্যামেরা সোর্স (Sender)</h2>
    <div class="status" id="status">ক্যামেরা চালু হচ্ছে...</div>
    
    <video id="localVideo" autoplay playsinline muted></video>

    <script>
        let localStream;
        const CAMERA_ID = 'akash-remote-camera-123'; // আইডি পরিবর্তন করা হয়েছে
        const peer = new Peer(CAMERA_ID);

        // ১. প্রথমে ক্যামেরা চালু করা
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
        .then((stream) => {
            localStream = stream;
            document.getElementById('localVideo').srcObject = stream;
            document.getElementById('status').innerText = "ক্যামেরা রেডি! ভিউয়ারের কলের অপেক্ষায়...";
        })
        .catch(err => {
            document.getElementById('status').innerHTML = `<span style="color:red">ক্যামেরা এরর: ${err.message}</span>`;
        });

        // ২. ভিউয়ার যখন ভিডিওর জন্য কল করবে, তখন কল রিসিভ করে ভিডিও পাঠানো
        peer.on('call', (call) => {
            document.getElementById('status').innerText = "ভিউয়ার কানেক্ট হয়েছে! লাইভ সম্প্রচার চলছে...";
            call.answer(localStream); // ভিউয়ারকে ভিডিও স্ট্রিম দেওয়া হলো
        });

        // ৩. টর্চ লাইট কমান্ড শোনার জন্য ডাটা কানেকশন
        peer.on('connection', (conn) => {
            conn.on('data', (data) => {
                if (data === 'toggle-flash') {
                    toggleFlashlight();
                }
            });
        });

        function toggleFlashlight() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            const hasTorch = track.getCapabilities().torch;
            if (hasTorch) {
                const isTorchOn = track.getConstraints().advanced?.[0]?.torch;
                track.applyConstraints({ advanced: [{ torch: !isTorchOn }] });
            }
        }
    </script>
</body>
</html>
